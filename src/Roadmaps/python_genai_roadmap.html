function renderNode(node) {
  const id = "n" + (idCounter++);
  const hasChildren = node.c && node.c.length;
  const isLeaf = !hasChildren;
  if (isLeaf) totalLeaves++;
  const done = progress[node.t] ? " done" : "";
  const checked = progress[node.t] ? "checked" : "";
  let html = '<div class="node" data-badge="' + (node.b || "") + '" data-leaf="' + isLeaf + '">';
  html += '<div class="node-head' + done + '">';
  html += '<span class="caret ' + (hasChildren ? "" : "leaf") + '" data-target="' + id + '">▶</span>';
  html += '<input type="checkbox" class="chk" data-title="' + encodeURIComponent(node.t) + '" ' + checked + ' />';
  html += '<span class="node-title">' + node.t + '</span>';
  html += badgeHtml(node.b);
  html += '</div>';
  if (hasChildren) {
    html += '<div class="children" id="' + id + '">';
    node.c.forEach(ch => html += renderNode(ch));
    html += '</div>';
  }
  html += '</div>';
  return html;
}

function renderPhase(phase) {
  const id = "p" + (idCounter++);
  let html = '<div class="phase">';
  html += '<div class="phase-head" data-target="' + id + '"><span class="caret" style="color:var(--phase)">▶</span>';
  html += '<span class="ptag">PHASE ' + phase.phase + '</span>' + phase.t.replace(/^PHASE \d+ — /, "");
  html += '</div><div class="children" id="' + id + '">';
  phase.c.forEach(ch => html += renderNode(ch));
  html += '</div></div>';
  return html;
}

const treeEl = document.getElementById("tree");
treeEl.innerHTML = DATA.map(renderPhase).join("");

/* caret toggle */
treeEl.addEventListener("click", e => {
  const caret = e.target.closest(".caret");
  const head = e.target.closest(".phase-head, .node-head");
  if (e.target.classList.contains("chk")) return;
  if (head) {
    const targetId = (caret && caret.dataset.target) || head.dataset.target ||
      (head.querySelector(".caret") && head.querySelector(".caret").dataset.target);
    if (!targetId) return;
    const box = document.getElementById(targetId);
    const c = head.querySelector(".caret");
    if (box) {
      box.classList.toggle("open");
      if (c) c.classList.toggle("open");
    }
  }
});

/* checkbox progress */
treeEl.addEventListener("change", e => {
  if (!e.target.classList.contains("chk")) return;
  const title = decodeURIComponent(e.target.dataset.title);
  const headEl = e.target.closest(".node-head");
  if (e.target.checked) { progress[title] = true; headEl.classList.add("done"); }
  else { delete progress[title]; headEl.classList.remove("done"); }
  localStorage.setItem(STORE_KEY, JSON.stringify(progress));
  updateProgress();
});

function updateProgress() {
  const done = Object.keys(progress).length;
  const pct = totalLeaves ? Math.round(done / totalLeaves * 100) : 0;
  document.getElementById("progBar").style.width = pct + "%";
  document.getElementById("progText").textContent = done + " / " + totalLeaves + " topics done (" + pct + "%)";
}
updateProgress();

/* expand / collapse all */
document.getElementById("expandAll").onclick = () => {
  document.querySelectorAll(".children").forEach(c => c.classList.add("open"));
  document.querySelectorAll(".caret:not(.leaf)").forEach(c => c.classList.add("open"));
};
document.getElementById("collapseAll").onclick = () => {
  document.querySelectorAll(".children").forEach(c => c.classList.remove("open"));
  document.querySelectorAll(".caret").forEach(c => c.classList.remove("open"));
};

/* core-only filter */
let coreOnly = false;
document.getElementById("coreOnly").onclick = e => {
  coreOnly = !coreOnly;
  e.target.textContent = coreOnly ? "Show All" : "Show Core only";
  document.querySelectorAll('.node[data-badge="deep"]').forEach(n => {
    n.classList.toggle("hidden", coreOnly);
  });
};

/* search */
document.getElementById("search").addEventListener("input", e => {
  const q = e.target.value.trim().toLowerCase();
  const nodes = document.querySelectorAll(".node");
  if (!q) {
    nodes.forEach(n => n.classList.remove("hidden"));
    document.querySelectorAll(".children").forEach(c => c.classList.remove("open"));
    document.querySelectorAll(".caret").forEach(c => c.classList.remove("open"));
    return;
  }
  nodes.forEach(n => {
    const title = n.querySelector(".node-title").textContent.toLowerCase();
    const match = title.includes(q);
    n.classList.toggle("hidden", !match);
    if (match) {
      let p = n.parentElement;
      while (p && p.id !== "tree") {
        if (p.classList.contains("children")) { p.classList.remove("hidden"); p.classList.add("open"); }
        if (p.classList.contains("node")) p.classList.remove("hidden");
        if (p.classList.contains("phase")) p.classList.remove("hidden");
        p = p.parentElement;
      }
    }
  });
});

/* theme toggle */
const themeBtn = document.getElementById("theme");
themeBtn.onclick = () => {
  const dark = document.documentElement.getAttribute("data-theme") === "dark";
  document.documentElement.setAttribute("data-theme", dark ? "light" : "dark");
  themeBtn.textContent = dark ? "🌙 Dark" : "☀️ Light";
  localStorage.setItem("pygenai_theme", dark ? "light" : "dark");
};
if (localStorage.getItem("pygenai_theme") === "dark") {
  document.documentElement.setAttribute("data-theme", "dark");
  themeBtn.textContent = "☀️ Light";
}

/* reset progress */
document.getElementById("reset").onclick = () => {
  if (confirm("Clear all progress ticks?")) {
    progress = {}; localStorage.removeItem(STORE_KEY);
    document.querySelectorAll(".chk").forEach(c => c.checked = false);
    document.querySelectorAll(".node-head.done").forEach(h => h.classList.remove("done"));
    updateProgress();
  }
};

/* open phase 1 by default */
const firstPhaseChildren = document.querySelector(".phase .children");
if (firstPhaseChildren) {
  firstPhaseChildren.classList.add("open");
  firstPhaseChildren.previousElementSibling.querySelector(".caret").classList.add("open");
}
</script>
</body>
</html>
